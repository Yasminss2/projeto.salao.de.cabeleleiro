<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
     <section id="agendamento-horarios" aria-labelledby="agendamento-horarios-titulo" class="section section-alt">
      <div class="container">
        <div class="card">
          <div class="box">
            <h2>Agendamento & Horários</h2>
            <p>Confira nossos horários disponíveis e agende seu atendimento personalizado. Estamos prontos para cuidar
              de você!</p>
            <select>
              <option value="9h">9:00</option>
              <option value="10h">10:00</option>
              <option value="11h">11:00</option>
              <option value="12h">12:00</option>
              <option value="13h">13:00</option>
              <option value="14h">14:00</option>
              <option value="15h">15:00</option>
              <option value="16h">16:00</option>
              <option value="17h">17:00</option>
            </select>
            <input type="date">
            <div>

              <form>
                <input type="text" placeholder="Nome Completo" required aria-required="true" />
                <input type="email" placeholder="E-mail" required aria-required="true" />
                <input type="tel" placeholder="Telefone" required aria-required="true" />
              </form>
                <select required>
                  <option value="corte">Corte Feminino</option>
                  <option value="penteados">Penteados</option>
                  <option value="Mechas">Mechas</option>
                  <option value="Escovação">Escovação</option>
                  <option value="Manicure">Progressiva</option>
                  <option value="Pedicure">Pedicure</option>
                  <option value="Maquiagem">Maquiagem</option>
                  <option value="Manicure">Manicure</option>
                </select>

                <input type="datetime-local" required>
                <a href="https://wa.me/5511986765431?text=Olá%20Studio%20Belle%20Vie,%20gostaria%20de%20agendar%20um%20horário!" target="_blank" rel="noopener noreferrer"></a>
                <button type="submit">Agendar pelo WhatsApp</button>
             
            </div>
          </div>
        </div>
    </section>


    <section id="contato" aria-labelledby="contato-titulo" class="section">
      <div class="container">
        <div class="card">
          <div class="container">

            <h2 id="contato-titulo">Contato</h2>
            <form class="form" novalidate>
              <div class="form-row">
                <label for="nome">Nome</label>
                <input id="nome" name="nome" type="text" required aria-required="true" />
              
              <div class="form-row">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" required aria-required="true" />

                <div class="form-row">
                  <label for="mensagem">Mensagem</label>
                  <textarea id="mensagem" name="mensagem" rows="4" required aria-required="true"></textarea>

                  <button type="submit" class="btn btn-primary">Enviar</button>
                  <p class="form-feedback" role="alert" aria-live="assertive" id="form-feedback"></p>
                  <div class="container">
                    
          <div class="box">
<p><iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3655.001034245013!2d-46.7791509!3d-23.640133999999996!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce5385d545699f%3A0x679406ba9e867572!2zVm9jYcOnw6NvIC0gU2VkZQ!5e0!3m2!1spt-BR!2sbr!4v1778787252730!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></p>
            </form>

            </div>
